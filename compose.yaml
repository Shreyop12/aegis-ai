services:
  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegisai

    ports:
      - "5432:5432"

    volumes:
      - aegis_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegisai"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16

    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegisai_test

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegisai_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aegis_postgres_data:

